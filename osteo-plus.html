  const groove=new THREE.Mesh(new THREE.TorusGeometry(Rc-0.004,0.013,8,72),capRib); groove.rotation.x=Math.PI/2; groove.position.y=yCap+0.10; bottle.add(groove);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(Rc+0.006,Rc+0.006,0.075,72),capMat); band.position.y=yCap+0.045; band.castShadow=true; bottle.add(band);
  const tabm=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.075,0.03),capMat); tabm.position.set(Math.sin(0.5)*(Rc+0.02),yCap+0.045,Math.cos(0.5)*(Rc+0.02)); tabm.rotation.y=-0.5; bottle.add(tabm);
  scene.add(bottle);

  const groundY=yBodyBot-0.10;
  const ground=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.ShadowMaterial({opacity:0.22}));
  ground.rotation.x=-Math.PI/2; ground.position.y=groundY; ground.receiveShadow=true; scene.add(ground);
  function groundDecal(uri,w,h,x,z){const t=new THREE.TextureLoader().load(uri); t.encoding=THREE.sRGBEncoding;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:0.98,depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.position.set(x,groundY+0.012,z); scene.add(m);}
  groundDecal(NEOFARMA_URI, 2.2, 2.2*NEO_AR, 0, 2.6);
  groundDecal(ITALY_URI, 1.05, 1.05*2/3, 2.7, 0.2);
  groundDecal(EU_URI, 1.25, 1.25*2/3, -2.7, 0.2);
  groundDecal(ORKID_URI, 1.5, 1.5*192/512, 0, -2.6);

  // عنصر طافٍ مناسب لطبيعة المنتج
  let liverTex=null; if(FLOAT==='liver'&&LIVER_URI){ liverTex=new THREE.TextureLoader().load(LIVER_URI); liverTex.encoding=THREE.sRGBEncoding; }
  function emojiSprite(ch){const cv=document.createElement('canvas');cv.width=cv.height=160;const g=cv.getContext('2d');
    g.font='120px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,80,88);
    const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;
    return new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));}
  const eggMat=new THREE.MeshStandardMaterial({color:0xf3ead9,roughness:0.35,metalness:0.02});
  const boneMat=new THREE.MeshStandardMaterial({color:0xf2efe6,roughness:0.5,metalness:0.02});
  function makeFloater(){const g=new THREE.Group();
    if(FLOAT==='liver'&&liverTex){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:liverTex,transparent:true,depthWrite:false}));sp.scale.set(LIVER_AR,1,1);g.add(sp);g.userData.spr=true;}
    else if(FLOAT==='egg'){const m=new THREE.Mesh(new THREE.SphereGeometry(0.5,28,28),eggMat);m.scale.set(0.82,1.15,0.82);m.castShadow=true;g.add(m);}
    else if(FLOAT==='bone'){const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.7,16),boneMat);cyl.castShadow=true;g.add(cyl);
      [0.45,-0.45].forEach(yy=>{[-0.13,0.13].forEach(xx=>{const s=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,16),boneMat);s.position.set(xx,yy,0);s.castShadow=true;g.add(s);});});}
    else {const sp=emojiSprite(FLOAT_EMOJI||'✨');g.add(sp);g.userData.spr=true;}
    return g;}
  const floaters=[]; const fcfg=[{R:3.05,y:1.8,s:1.1,a:0.6,bs:0.8,bob:0.32,spin:0.010},{R:3.3,y:0.1,s:1.4,a:3.6,bs:1.0,bob:0.4,spin:-0.008}];
  fcfg.forEach(c=>{const f=makeFloater(); f.scale.setScalar(c.s); Object.assign(f.userData,c); floaters.push(f); scene.add(f);});

  // نقاط المواصفات
  function lighten(hex,a){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r+(255-r)*a);g=Math.round(g+(255-g)*a);b=Math.round(b+(255-b)*a);return 'rgb('+r+','+g+','+b+')';}
  const glowCv=document.createElement('canvas');glowCv.width=glowCv.height=128;
  (function(){const g=glowCv.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,0.95)');gr.addColorStop(0.35,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);})();
  const glowTex=new THREE.CanvasTexture(glowCv);
  function makeFace(color,icon){const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');
    const gr=g.createRadialGradient(50,44,4,64,66,60);gr.addColorStop(0,lighten(color,0.78));gr.addColorStop(1,color);
    g.beginPath();g.arc(64,64,57,0,Math.PI*2);g.fillStyle=gr;g.fill();
    g.lineWidth=6;g.strokeStyle='rgba(255,255,255,0.92)';g.beginPath();g.arc(64,64,57,0,Math.PI*2);g.stroke();
    g.beginPath();g.ellipse(50,44,20,12,-0.5,0,Math.PI*2);g.fillStyle='rgba(255,255,255,0.32)';g.fill();
    g.font='54px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(icon,64,70);
    const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;}
  const nodes=[]; const faces=[];
  const NPOS=[{az:20,y:1.8},{az:80,y:0.5},{az:140,y:1.3},{az:200,y:-0.4},{az:260,y:0.9},{az:320,y:1.6}];
  const NR=2.65;
  NPOS.forEach((p,i)=>{const st=NODE_STYLE[i];const rad=p.az*Math.PI/180;
    const pos=new THREE.Vector3(Math.sin(rad)*NR,p.y,Math.cos(rad)*NR);const grp=new THREE.Group();grp.position.copy(pos);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:new THREE.Color(st.c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));halo.scale.set(0.95,0.95,1);grp.add(halo);grp.userData.halo=halo;
    const face=new THREE.Sprite(new THREE.SpriteMaterial({map:makeFace(st.c,st.icon),transparent:true,depthWrite:false}));face.scale.set(0.5,0.5,1);face.userData.index=i;grp.add(face);faces.push(face);
    const dir=new THREE.Vector3(pos.x,0,pos.z).normalize();
    const inner=new THREE.Vector3(dir.x*(R+0.06),Math.max(yBodyBot+0.15,Math.min(yBodyTop-0.15,pos.y)),dir.z*(R+0.06));
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos,inner]),new THREE.LineBasicMaterial({color:new THREE.Color(st.c),transparent:true,opacity:0.35}));
    scene.add(line);scene.add(grp);nodes.push(grp);});

  const popup=document.getElementById('popup'),head=popup.querySelector('.head');
  const pTitle=popup.querySelector('h4'),pEn=popup.querySelector('.en'),pUl=popup.querySelector('ul');
  const infoEl=document.getElementById('info'),tipEl=document.getElementById('tip');
  const toggleBtn=document.getElementById('toggle'),langBtn=document.getElementById('langbtn');
  let activeNode=-1;
  function styleDots(color){let s=document.getElementById('dotstyle');if(!s){s=document.createElement('style');s.id='dotstyle';document.head.appendChild(s);}s.textContent='#popup li::before{background:'+color+';box-shadow:0 0 6px '+color+'}';}
  function fillPopup(i){const st=NODE_STYLE[i],cur=SPECS[i][lang],oth=SPECS[i][lang==='ar'?'en':'ar'];
    head.style.background='linear-gradient(135deg,'+lighten(st.c,0.15)+','+st.c+')';
    popup.style.boxShadow='0 0 0 2px '+st.c+'aa, 0 10px 30px rgba(20,30,60,.35), 0 0 26px '+st.c+'80';
    pTitle.textContent=st.icon+'  '+cur.t;pEn.textContent=oth.t;
    pUl.innerHTML='';cur.items.forEach(x=>{const li=document.createElement('li');li.textContent=x;pUl.appendChild(li);});styleDots(st.c);}
  function openPopup(i){activeNode=i;fillPopup(i);popup.classList.add('show');autoRotate=false;setToggle();positionPopup();}
  function closePopup(){activeNode=-1;popup.classList.remove('show');}
  popup.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();closePopup();});
  function positionPopup(){if(activeNode<0)return;const wp=nodes[activeNode].position.clone();wp.project(camera);
    const sx=(wp.x*0.5+0.5)*innerWidth,sy=(-wp.y*0.5+0.5)*innerHeight,w=popup.offsetWidth||320,h=popup.offsetHeight||170;
    let left=sx<innerWidth/2?sx+22:sx-w-22,top=sy-h/2;left=Math.max(10,Math.min(innerWidth-w-10,left));top=Math.max(60,Math.min(innerHeight-h-10,top));
    popup.style.left=left+'px';popup.style.top=top+'px';popup.style.transformOrigin=(sx<innerWidth/2?'left':'right')+' center';}
  function setToggle(){toggleBtn.textContent=autoRotate?T[lang].rotStop:T[lang].rotStart;}
  function applyLang(l){lang=l;document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');document.documentElement.setAttribute('lang',l);
    infoEl.textContent=T[l].info;tipEl.textContent=T[l].tip;langBtn.textContent=T[l].langBtn;setToggle();
    if(activeNode>=0){fillPopup(activeNode);positionPopup();}}
  langBtn.addEventListener('click',()=>applyLang(lang==='ar'?'en':'ar'));

  const cam={theta:0,phi:1.4,radius:11.6,target:new THREE.Vector3(0,0.2,0)};
  let autoRotate=true,dragging=false,px=0,py=0,moved=0;
  function applyCam(){const r=cam.radius,ph=Math.max(0.4,Math.min(Math.PI-0.4,cam.phi));camera.position.set(cam.target.x+r*Math.sin(ph)*Math.sin(cam.theta),cam.target.y+r*Math.cos(ph),cam.target.z+r*Math.sin(ph)*Math.cos(cam.theta));camera.lookAt(cam.target);}
  const ray=new THREE.Raycaster();const ptr=new THREE.Vector2();
  function pick(cx,cy){ptr.x=(cx/innerWidth)*2-1;ptr.y=-(cy/innerHeight)*2+1;ray.setFromCamera(ptr,camera);const hits=ray.intersectObjects(faces.concat([body]),false);if(hits.length&&hits[0].object!==body)return hits[0].object.userData.index;return -1;}
  const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;moved=0;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(dragging){const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);if(moved>6){autoRotate=false;setToggle();}cam.theta-=dx*0.008;cam.phi-=dy*0.008;px=e.clientX;py=e.clientY;}else{el.style.cursor=pick(e.clientX,e.clientY)>=0?'pointer':'default';}});
  el.addEventListener('pointerup',e=>{dragging=false;if(moved<6){const i=pick(e.clientX,e.clientY);if(i>=0)openPopup(i);else closePopup();}});
  el.addEventListener('wheel',e=>{e.preventDefault();cam.radius=Math.max(6,Math.min(18,cam.radius+e.deltaY*0.004));},{passive:false});
  toggleBtn.addEventListener('click',()=>{autoRotate=!autoRotate;setToggle();});
  const clock=new THREE.Clock();
  function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(autoRotate)cam.theta+=0.0026;
    const pulse=1+0.16*Math.sin(t*3);nodes.forEach((n,i)=>{const hs=(i===activeNode)?1.3:1;n.userData.halo.scale.set(0.95*pulse*hs,0.95*pulse*hs,1);});
    floaters.forEach(f=>{const c=f.userData;const ang=c.a+t*0.15;f.position.set(Math.cos(ang)*c.R,c.y+Math.sin(t*c.bs)*c.bob,Math.sin(ang)*c.R);if(!c.spr)f.rotation.y+=c.spin;});
    applyCam();if(activeNode>=0)positionPopup();renderer.render(scene,camera);}
  applyLang('ar');animate();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);positionPopup();});
  </script></body></html>
