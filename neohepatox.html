  const SPECS = [

    { ar:{t:"الحيوانات المستهدفة", items:["الدواجن، الأبقار، الإبل، الخيول، الأغنام/الحملان."]},

      en:{t:"Indications", items:[

    { ar:{t:"الفوائد الأساسية", items:[

    { ar:{t:"الحالات المستهدفة", items:[

        "التسمم الفطري بعد التعرض للسموم الفطرية في العليقة.",
        "التسمم الدوائي: تخفيف العبء السمي للأدوية (كالسلفا والمضادات الحيوية) على الكبد."]},

    { ar:{t:"المكوّنات (لكل لتر)", items:[
        "فيتامين ب1: 500 · ب2: 1000 · ب6: 500 · ب12: 10 ملجم.",
        "إل‑كارنيتين: 25000 · كلوريد الكولين: 75000 · بيتين: 50000 ملجم.",
        "إل‑ليسين: 20000 · دي‑إل‑ميثيونين: 50000 · مستخلصات الخرشوف: 25000 ملجم.",
        "ماء نقي حتى 1 لتر."]},
      en:{t:"Ingredients (per liter)", items:[
        "Vitamin B1: 500 · B2: 1000 · B6: 500 · B12: 10 mg.",
        "L-carnitine: 25,000 · choline chloride: 75,000 · betaine: 50,000 mg.",
        "L-lysine: 20,000 · DL-methionine: 50,000 · artichoke extracts: 25,000 mg.",
        "Purified water up to 1 L."]}},
    { ar:{t:"طريقة الاستخدام", items:[
        "الدواجن: 1 لتر لكل 1000 لتر ماء الشرب لمدة 5–6 أيام متتالية.",
        "الأبقار والإبل والأغنام: نفس الجرعة لمدة 5–6 أيام.",

      en:{t:"Directions for use", items:[
        "Poultry: 1 L per 1000 L of drinking water for 5–6 consecutive days.",
        "Cows, camels, sheep: same dose for 5–6 days.",
        "Horses and lambs: 1 L per 1000 L for 5–6 days."]}},
    { ar:{t:"التخزين والمنشأ", items:[
        "تحفظ العبوة مغلقة بإحكام، في مكان جاف < 30°م، بعيداً عن الشمس المباشرة.",
        "بلد المنشأ: إيطاليا — المصنّع: Neofarma SRL.",
        "المستورد والموزّع: شركة أوركيد النماء التجارية — الرياض."]},
      en:{t:"Storage & origin", items:[
        "Keep tightly closed, in a dry place < 30°C, away from direct sunlight.",
        "Country of origin: Italy — Manufacturer: Neofarma SRL.",
        "Importer & distributor: Awrkid Alnma Commercial Co. — Riyadh."]}}
  ];

  let lang="ar";

  const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe9eef4);
  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputEncoding=THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.35));
  const key=new THREE.DirectionalLight(0xffffff,0.95); key.position.set(4,11,7); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=1; key.shadow.camera.far=50;
  key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=8;key.shadow.camera.bottom=-8; key.shadow.bias=-0.0004; scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,0.22); fill.position.set(-6,3,-4); scene.add(fill);

  // ===== زجاجة السائل (أبعاد مطابقة للعبوة الحقيقية) =====
  // جسم مكتنز طويل نسبياً + كتف قصير + عنق عريض + غطاء أبيض عريض مضلّع
  const R=1.0, Hb=4.3;                    // القطر 2، ارتفاع الجسم ≈ 2.15× القطر
  const Hs=0.42, Rn=0.5, Hn=0.12, Rc=0.62, Hc=0.62;
  const yBodyTop=Hb/2, yBodyBot=-Hb/2;
  const TS=-0.17*Math.PI*2;               // الواجهة (الاسم/الشعار) تواجه الأمام
  const bottle=new THREE.Group();
  const whiteB=new THREE.MeshStandardMaterial({color:0xf6f6f4,roughness:0.32,metalness:0.04});
  const capMat=new THREE.MeshStandardMaterial({color:0xeeeeec,roughness:0.42,metalness:0.03});
  const capRib=new THREE.MeshStandardMaterial({color:0xdedede,roughness:0.5,metalness:0.03});

  // جسم أبيض كامل
  const body=new THREE.Mesh(new THREE.CylinderGeometry(R,R,Hb,140),whiteB);
  body.castShadow=true; body.receiveShadow=true; bottle.add(body);

  // الملصق كشريط ملفوف في وسط الجسم (لا يغطّيه كاملاً)
  const tex=new THREE.TextureLoader().load(LABEL_URI);
  tex.encoding=THREE.sRGBEncoding; tex.wrapS=THREE.ClampToEdgeWrapping; tex.wrapT=THREE.ClampToEdgeWrapping;
  tex.generateMipmaps=false; tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter; tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const sideMat=new THREE.MeshStandardMaterial({map:tex,roughness:0.4,metalness:0.03});
  const labelH=2*Math.PI*R/1.629;         // ارتفاع بلا تشويه وفق نسبة الملصق
  const labelTop=yBodyTop-0.35;           // هامش أبيض أعلى أكبر (كالصورة)
  const labelY=labelTop-labelH/2;
  const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(R+0.006,R+0.006,labelH,140,1,true,TS,Math.PI*2),sideMat);
  sleeve.position.y=labelY; sleeve.castShadow=true; sleeve.receiveShadow=true; bottle.add(sleeve);

  // قاعدة
  const foot=new THREE.Mesh(new THREE.CylinderGeometry(R*0.99,R*0.95,0.16,140),whiteB);
  foot.position.y=yBodyBot-0.02; foot.castShadow=true; foot.receiveShadow=true; bottle.add(foot);

  // كتف قصير منحنٍ (Lathe)
  const shPts=[]; const nS=16;
  for(let i=0;i<=nS;i++){const t=i/nS; const y=yBodyTop+t*Hs; const r=Rn+(R-Rn)*Math.cos(t*Math.PI/2); shPts.push(new THREE.Vector2(r,y));}
  const shoulder=new THREE.Mesh(new THREE.LatheGeometry(shPts,140),whiteB);
  shoulder.castShadow=true; shoulder.receiveShadow=true; bottle.add(shoulder);

  // عنق عريض قصير
  const yNeck=yBodyTop+Hs;
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(Rn,Rn,Hn,90),whiteB);
  neck.position.y=yNeck+Hn/2; neck.castShadow=true; bottle.add(neck);

  // غطاء أبيض عريض بأخاديد رأسية + شريط علوي أملس + حلقة أمان سفلية (مطابق للصورة المقرّبة)
  const yCap=yNeck+Hn;
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(Rc,Rc,Hc,72),capMat);
  cap.position.y=yCap+Hc/2; cap.castShadow=true; cap.receiveShadow=true; bottle.add(cap);
  // حافة علوية مستديرة + سطح علوي أملس
  const rim=new THREE.Mesh(new THREE.TorusGeometry(Rc-0.03,0.032,12,72),capMat);
  rim.rotation.x=Math.PI/2; rim.position.y=yCap+Hc-0.03; bottle.add(rim);
  const capTop=new THREE.Mesh(new THREE.CylinderGeometry(Rc-0.03,Rc-0.03,0.05,72),capMat);
  capTop.position.y=yCap+Hc; capTop.castShadow=true; bottle.add(capTop);
  // أخاديد رأسية للقبض (vertical flutes)
  const nF=22, fluteH=Hc*0.5, fluteY=yCap+Hc*0.44;
  for(let i=0;i<nF;i++){const ang=i/nF*Math.PI*2;
    const fr=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,fluteH,8),capRib);
    fr.position.set(Math.sin(ang)*Rc, fluteY, Math.cos(ang)*Rc); fr.castShadow=true; bottle.add(fr);}
  // أخدود فاصل رفيع + حلقة أمان سفلية
  const groove=new THREE.Mesh(new THREE.TorusGeometry(Rc-0.004,0.013,8,72),capRib);
  groove.rotation.x=Math.PI/2; groove.position.y=yCap+0.10; bottle.add(groove);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(Rc+0.006,Rc+0.006,0.075,72),capMat);
  band.position.y=yCap+0.045; band.castShadow=true; bottle.add(band);
  // لسان صغير على حلقة الأمان
  const tab=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.075,0.03),capMat);
  tab.position.set(Math.sin(0.5)*(Rc+0.02), yCap+0.045, Math.cos(0.5)*(Rc+0.02)); tab.rotation.y=-0.5; bottle.add(tab);

  scene.add(bottle);

  const groundY=yBodyBot-0.10;
  const ground=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.ShadowMaterial({opacity:0.22}));
  ground.rotation.x=-Math.PI/2; ground.position.y=groundY; ground.receiveShadow=true; scene.add(ground);

  // شعار أوركيد على الأرض
  const orkTex=new THREE.TextureLoader().load(ORKID_URI); orkTex.encoding=THREE.sRGBEncoding;
  const orkW=1.6, orkH=orkW*192/512;
  const orkid=new THREE.Mesh(new THREE.PlaneGeometry(orkW,orkH),
    new THREE.MeshBasicMaterial({map:orkTex,transparent:true,opacity:0.95,depthWrite:false}));
  orkid.rotation.x=-Math.PI/2; orkid.position.set(0,groundY+0.01,2.05); scene.add(orkid);

  // قطرات سائلة تطفو حول الزجاجة (طابع المنتج السائل)
  const dropMat=new THREE.MeshStandardMaterial({color:0xe0a63a,roughness:0.15,metalness:0.0,transparent:true,opacity:0.8});
  const drops=[]; const dcfg=[
    {R:3.0,y:2.4,s:0.16,a:0.4,bs:1.0,bob:0.3},{R:3.3,y:1.4,s:0.2,a:2.4,bs:0.8,bob:0.35},
    {R:2.9,y:2.9,s:0.13,a:4.2,bs:1.2,bob:0.25},{R:3.4,y:0.6,s:0.18,a:5.4,bs:0.9,bob:0.4}];
  dcfg.forEach(c=>{const g=new THREE.SphereGeometry(1,20,20); const m=new THREE.Mesh(g,dropMat);
    m.scale.set(c.s,c.s*1.25,c.s); m.userData=c; drops.push(m); scene.add(m);});

  // ===== نقاط المواصفات =====
  function lighten(hex,a){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*a);g=Math.round(g+(255-g)*a);b=Math.round(b+(255-b)*a);return 'rgb('+r+','+g+','+b+')';}
  const glowCv=document.createElement('canvas'); glowCv.width=glowCv.height=128;
  (function(){const g=glowCv.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba(255,255,255,0.95)');gr.addColorStop(0.35,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.fillRect(0,0,128,128);})();
  const glowTex=new THREE.CanvasTexture(glowCv);
  function makeFace(color,icon){
    const cv=document.createElement('canvas'); cv.width=cv.height=128; const g=cv.getContext('2d');
    const gr=g.createRadialGradient(50,44,4,64,66,60); gr.addColorStop(0,lighten(color,0.78)); gr.addColorStop(1,color);
    g.beginPath(); g.arc(64,64,57,0,Math.PI*2); g.fillStyle=gr; g.fill();
    g.lineWidth=6; g.strokeStyle='rgba(255,255,255,0.92)'; g.beginPath(); g.arc(64,64,57,0,Math.PI*2); g.stroke();
    g.beginPath(); g.ellipse(50,44,20,12,-0.5,0,Math.PI*2); g.fillStyle='rgba(255,255,255,0.32)'; g.fill();
    g.font='54px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(icon,64,70);
    const t=new THREE.CanvasTexture(cv); t.encoding=THREE.sRGBEncoding; return t;
  }
  const nodes=[]; const faces=[];
  const NPOS=[{az:20,y:1.8},{az:65,y:0.5},{az:110,y:1.3},{az:155,y:-0.7},{az:200,y:1.0},{az:245,y:-1.5},{az:290,y:0.1},{az:335,y:1.7}];
  const NR=2.65;
  NPOS.forEach((p,i)=>{
    const st=NODE_STYLE[i]; const rad=p.az*Math.PI/180;
    const pos=new THREE.Vector3(Math.sin(rad)*NR,p.y,Math.cos(rad)*NR);
    const grp=new THREE.Group(); grp.position.copy(pos);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:new THREE.Color(st.c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    halo.scale.set(0.95,0.95,1); grp.add(halo); grp.userData.halo=halo;
    const face=new THREE.Sprite(new THREE.SpriteMaterial({map:makeFace(st.c,st.icon),transparent:true,depthWrite:false}));
    face.scale.set(0.5,0.5,1); face.userData.index=i; grp.add(face); faces.push(face);
    const dir=new THREE.Vector3(pos.x,0,pos.z).normalize();
    const inner=new THREE.Vector3(dir.x*(R+0.06),Math.max(yBodyBot+0.15,Math.min(yBodyTop-0.15,pos.y)),dir.z*(R+0.06));
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos,inner]),
      new THREE.LineBasicMaterial({color:new THREE.Color(st.c),transparent:true,opacity:0.35}));
    scene.add(line); scene.add(grp); nodes.push(grp);
  });

  // ===== بطاقة + لغة =====
  const popup=document.getElementById('popup'), head=popup.querySelector('.head');
  const pTitle=popup.querySelector('h4'), pEn=popup.querySelector('.en'), pUl=popup.querySelector('ul');
  const infoEl=document.getElementById('info'), tipEl=document.getElementById('tip');
  const toggleBtn=document.getElementById('toggle'), langBtn=document.getElementById('langbtn');
  let activeNode=-1;
  function styleDots(color){let s=document.getElementById('dotstyle'); if(!s){s=document.createElement('style');s.id='dotstyle';document.head.appendChild(s);}
    s.textContent='#popup li::before{background:'+color+';box-shadow:0 0 6px '+color+'}';}
  function fillPopup(i){
    const st=NODE_STYLE[i], cur=SPECS[i][lang], oth=SPECS[i][lang==='ar'?'en':'ar'];
    head.style.background='linear-gradient(135deg,'+lighten(st.c,0.15)+','+st.c+')';
    popup.style.boxShadow='0 0 0 2px '+st.c+'aa, 0 10px 30px rgba(20,30,60,.35), 0 0 26px '+st.c+'80';
    pTitle.textContent=st.icon+'  '+cur.t; pEn.textContent=oth.t;
    pUl.innerHTML=''; cur.items.forEach(x=>{const li=document.createElement('li');li.textContent=x;pUl.appendChild(li);});
    styleDots(st.c);
  }
  function openPopup(i){ activeNode=i; fillPopup(i); popup.classList.add('show'); autoRotate=false; setToggle(); positionPopup(); }
  function closePopup(){ activeNode=-1; popup.classList.remove('show'); }
  popup.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();closePopup();});
  function positionPopup(){ if(activeNode<0)return; const wp=nodes[activeNode].position.clone(); wp.project(camera);
    const sx=(wp.x*0.5+0.5)*innerWidth, sy=(-wp.y*0.5+0.5)*innerHeight, w=popup.offsetWidth||320, h=popup.offsetHeight||170;
    let left=sx<innerWidth/2?sx+22:sx-w-22, top=sy-h/2;
    left=Math.max(10,Math.min(innerWidth-w-10,left)); top=Math.max(60,Math.min(innerHeight-h-10,top));
    popup.style.left=left+'px'; popup.style.top=top+'px'; popup.style.transformOrigin=(sx<innerWidth/2?'left':'right')+' center';}
  function setToggle(){ toggleBtn.textContent = autoRotate?T[lang].rotStop:T[lang].rotStart; }
  function applyLang(l){ lang=l;
    document.documentElement.setAttribute('dir', l==='ar'?'rtl':'ltr'); document.documentElement.setAttribute('lang', l);
    infoEl.textContent=T[l].info; tipEl.textContent=T[l].tip; langBtn.textContent=T[l].langBtn; setToggle();
    if(activeNode>=0){ fillPopup(activeNode); positionPopup(); }
  }
  langBtn.addEventListener('click',()=>applyLang(lang==='ar'?'en':'ar'));

  // ===== تحكّم =====
  const cam={theta:0,phi:1.4,radius:11.6,target:new THREE.Vector3(0,0.2,0)};
  let autoRotate=true, dragging=false, px=0, py=0, moved=0;
  function applyCam(){const r=cam.radius,ph=Math.max(0.4,Math.min(Math.PI-0.4,cam.phi));
    camera.position.set(cam.target.x+r*Math.sin(ph)*Math.sin(cam.theta),cam.target.y+r*Math.cos(ph),cam.target.z+r*Math.sin(ph)*Math.cos(cam.theta)); camera.lookAt(cam.target);}
  const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2();
  function pick(cx,cy){ ptr.x=(cx/innerWidth)*2-1; ptr.y=-(cy/innerHeight)*2+1; ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(faces.concat([body]),false);
    if(hits.length && hits[0].object!==body) return hits[0].object.userData.index; return -1;}
  const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;moved=0;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{ if(dragging){const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);
      if(moved>6){autoRotate=false;setToggle();} cam.theta-=dx*0.008;cam.phi-=dy*0.008;px=e.clientX;py=e.clientY;}
    else{ el.style.cursor=pick(e.clientX,e.clientY)>=0?'pointer':'default'; } });
  el.addEventListener('pointerup',e=>{ dragging=false; if(moved<6){const i=pick(e.clientX,e.clientY); if(i>=0)openPopup(i); else closePopup();} });
  el.addEventListener('wheel',e=>{e.preventDefault();cam.radius=Math.max(6,Math.min(18,cam.radius+e.deltaY*0.004));},{passive:false});
  toggleBtn.addEventListener('click',()=>{autoRotate=!autoRotate;setToggle();});

  const clock=new THREE.Clock();
  function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
    if(autoRotate) cam.theta+=0.0026;
    const pulse=1+0.16*Math.sin(t*3);
    nodes.forEach((n,i)=>{const hs=(i===activeNode)?1.3:1; n.userData.halo.scale.set(0.95*pulse*hs,0.95*pulse*hs,1);});
    drops.forEach(c=>{const d=c.userData;const ang=d.a+t*0.14;
      c.position.set(Math.cos(ang)*d.R, d.y+Math.sin(t*d.bs)*d.bob, Math.sin(ang)*d.R);});
    applyCam(); if(activeNode>=0) positionPopup(); renderer.render(scene,camera);
  }
  applyLang('ar'); animate();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);positionPopup();});
  </script>
